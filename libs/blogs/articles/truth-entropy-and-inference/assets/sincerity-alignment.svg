<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Sincerity alignment instrument</title>
  <desc id="description">A central equality mark aligns inner state with outward expression.</desc>
  <g stroke="#a48756" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 130c25 0 29-14 53-14s24 28 48 28 24-28 48-28c21 0 27 14 39 14M232 130c12 0 18-14 39-14 24 0 24 28 48 28s24-28 48-28 28 14 53 14" opacity=".64"/>
    <path d="M220 56v146" opacity=".72"/>
    <circle cx="220" cy="56" r="4.5" fill="#a48756" stroke="none"/>
    <circle cx="220" cy="202" r="4.5" fill="#a48756" stroke="none"/>
    <circle cx="220" cy="130" r="32" fill="#0d0e0f"/>
    <circle cx="220" cy="130" r="32" opacity=".9"/>
    <path d="M210 124h20M210 136h20"/>
