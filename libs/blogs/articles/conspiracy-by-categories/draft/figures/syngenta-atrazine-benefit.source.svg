<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 792" role="img" aria-labelledby="syngenta-strategy-title syngenta-strategy-desc">
  <title id="syngenta-strategy-title">Syngenta’s strategy</title>
  <desc id="syngenta-strategy-desc">A proposed sequence connects lobbying over EPA evidence standards to a costly research barrier and reduced liability. Syngenta describes required industry studies as costing millions. In the historical review criticized by EPA’s 2012 science panel, only Syngenta’s study qualified for quantitative assessment of frog effects.</desc>
  <style>
    .node { fill:var(--color-paper-2); stroke:var(--color-rule-solid); stroke-width:1; }
    .node-name { font-size:28px; }
    .body { font-size:22px; fill:var(--color-ink); }
    .lane { font-size:16px; letter-spacing:1px; fill:var(--color-muted); }
    .inference { fill:none; stroke:var(--color-accent); stroke-width:2; stroke-dasharray:6 6; }
    .source-link { font-size:16px; fill:var(--color-muted); }
  </style>
  <defs>
    <marker id="syngenta-strategy-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--color-accent)"/></marker>
  </defs>
  <rect width="1000" height="792" fill="var(--color-paper)"/>
  <text x="40" y="36" class="eyebrow" font-size="16" data-text-max-width="920">CASE STUDY / ATRAZINE</text>
  <text x="40" y="92" class="diagram-title" font-size="48" data-text-max-width="920">Syngenta’s strategy</text>
  <text x="40" y="128" class="subtitle" font-size="24" data-text-max-width="920">Legal and scientific actions that can limit liability.</text>

  <!-- A single proposed sequence: Legal to Science to Reduce liability. -->
  <path id="syngenta-legal-science" class="inference" d="M312 388 V448" marker-end="url(#syngenta-strategy-arrow)" data-graph-role="edge" data-edge-from="legal" data-edge-to="scientific"/>
  <path id="syngenta-science-liability" class="inference" d="M588 560 H652" marker-end="url(#syngenta-strategy-arrow)" data-graph-role="edge" data-edge-from="scientific" data-edge-to="reduce-liability"/>

  <g data-graph-role="node" data-node-id="legal">
    <rect x="40" y="176" width="548" height="212" class="node"/>
    <text x="64" y="204" class="eyebrow lane">01 / LEGAL</text>
    <text x="64" y="244" class="node-name" data-text-max-width="500">Lobby to set new EPA “standards”</text>
    <text x="64" y="280" class="body" data-text-max-width="500">Syngenta’s lobbyist used the Data Quality Act</text>
    <text x="64" y="308" class="body" data-text-max-width="500">to challenge adverse findings. EPA revised</text>
    <text x="64" y="336" class="body" data-text-max-width="500">its assessment in response. [1, 2, 6]</text>
  </g>
  <g data-graph-role="node" data-node-id="scientific">
    <rect x="40" y="452" width="548" height="212" class="node"/>
    <text x="64" y="480" class="eyebrow lane">02 / SCIENCE</text>
    <text x="64" y="520" class="node-name" data-text-max-width="500">A “pay to play” barrier</text>
    <text x="64" y="556" class="body" data-text-max-width="500">EPA-required industry studies cost millions,</text>
    <text x="64" y="584" class="body" data-text-max-width="500">according to Syngenta. [7] Such costs can put</text>
    <text x="64" y="612" class="body" data-text-max-width="500">independent researchers’ challenges</text>
    <text x="64" y="640" class="body" data-text-max-width="500">out of financial reach.</text>
  </g>

  <g data-graph-role="node" data-node-id="reduce-liability">
    <rect x="656" y="432" width="304" height="232" fill="var(--color-accent-tint)" stroke="var(--color-accent)"/>
    <text x="680" y="476" class="diagram-title" font-size="40" data-text-max-width="256">Reduce</text>
    <text x="680" y="520" class="diagram-title" font-size="40" data-text-max-width="256">liability</text>
    <text x="680" y="556" class="body" data-text-max-width="256">EPA’s quantitative</text>
    <text x="680" y="584" class="body" data-text-max-width="256">review of frog effects</text>
    <text x="680" y="612" class="body" data-text-max-width="256">relied only on</text>
    <text x="680" y="640" class="body" data-text-max-width="256">Syngenta’s study. [3]</text>
  </g>

  <path d="M40 704 H80" class="inference"/>
  <text x="96" y="712" class="subtitle" font-size="20" data-text-max-width="864">Proposed route to reduced liability.</text>
  <text x="40" y="748" class="subtitle" font-size="20" data-text-max-width="920">2012 EPA panel: only 1 of 75 studies qualified; the panel objected. [3]</text>
  <text x="40" y="780" class="source-link" data-text-max-width="920">Historical case: 2000–2012 · Source numbers match the article’s Syngenta sources.</text>
</svg>
