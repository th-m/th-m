  <g font-family="IBM Plex Mono, ui-monospace, monospace" fill="#17131b">
    <text x="137" y="50" font-size="4.2" font-weight="700">T · ROOF</text>
    <text x="137" y="58" font-size="3.5">6.72u above cap</text>
    <text x="137" y="65" font-size="3.5">No baseline overshoot</text>
    <text x="361" y="50" font-size="4.2" font-weight="700">O · ROUND FORM</text>
    <text x="361" y="58" font-size="3.5">Centerline and rim overshoot</text>
    <text x="361" y="65" font-size="3.5">above cap and below baseline</text>
    <text x="137" y="118" font-size="3.25" fill="#4b416a">The roof is a filled contour:</text>
    <text x="137" y="125" font-size="3.25" fill="#4b416a">its geometric and visible bounds coincide.</text>
    <text x="361" y="118" font-size="3.25" fill="#4b416a">The O is stroked:</text>
    <text x="361" y="125" font-size="3.25" fill="#4b416a">rim thickness expands beyond its centerline.</text>
