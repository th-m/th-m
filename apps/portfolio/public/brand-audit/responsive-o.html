<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>THOM O responsive scale fixture</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #050505; }
      body { display: grid; grid-template-columns: repeat(2, max-content); gap: 48px; align-items: start; padding: 24px; }
      figure { display: grid; grid-template-columns: repeat(2, max-content); gap: 16px; margin: 0; }
      .stage { position: relative; background: #050505; overflow: hidden; }
      .stage canvas, .stage img { display: block; width: 100%; height: 100%; }
      .stage img { object-fit: contain; }
      [data-size="small"] .stage { width: 120px; height: 120px; }
      [data-size="large"] .stage { width: 360px; height: 360px; }
    </style>
  </head>
  <body>
    <figure data-size="small" aria-label="Small O at 120 by 120 pixels">
      <div class="stage" data-renderer="webgl"><canvas aria-hidden="true"></canvas></div>
      <div class="stage" data-renderer="svg"><img src="/brand/glyph-o.svg" alt="" /></div>
    </figure>
    <figure data-size="large" aria-label="Large O at 360 by 360 pixels">
      <div class="stage" data-renderer="webgl"><canvas aria-hidden="true"></canvas></div>
      <div class="stage" data-renderer="svg"><img src="/brand/glyph-o.svg" alt="" /></div>
    </figure>
    <script type="module">
      import { ThomSceneController } from "/src/brand/thom/threeScene.ts";

      const controllers = [...document.querySelectorAll("canvas")].map((canvas) => {
        const controller = new ThomSceneController(canvas, "o");
        controller.setView("o");
        controller.settle();
        return controller;
      });
      window.__thomResponsiveOControllers = controllers;
      document.documentElement.dataset.ready = "true";
    </script>
  </body>
</html>
