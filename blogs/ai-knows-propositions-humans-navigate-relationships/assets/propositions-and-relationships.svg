      <text x="165" text-anchor="middle" class="node-title" font-size="21"><tspan x="165" y="742.445">PRODUCT</tspan><tspan x="165" y="761.5550000000001">BET</tspan></text>
      <text x="165" y="810" text-anchor="middle" class="node-detail">TEAM DECISION</text>
    </g>
