      <circle cx="350" cy="535" r="82" fill="url(#node-neutral)" stroke="#f2e5cf" stroke-opacity="0.34" stroke-width="1.2"/>
      <circle cx="350" cy="454" r="3" fill="#d6b06a"/>
      <text x="350" y="478" text-anchor="middle" class="node-index">P.03</text>
      <text x="350" text-anchor="middle" class="node-title" font-size="21"><tspan x="350" y="527.445">MARKET</tspan><tspan x="350" y="546.5550000000001">SHARE</tspan></text>
      <text x="350" y="595" text-anchor="middle" class="node-detail">CATEGORY MEASURE</text>
    </g>
    <g class="proposition">
