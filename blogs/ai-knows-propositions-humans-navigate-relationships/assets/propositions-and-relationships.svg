<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Propositions as nodes and relationships as edges</title>
  <desc id="description">A sparse network where factual propositions are circular nodes and situated relationships are gold labeled edges. The highlighted path connects touchscreen to felt possibility through the relationship invites gesture.</desc>
  <defs>
    <radialGradient id="background-glow" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#17130e"/>
      <stop offset="0.62" stop-color="#080706"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="node-neutral" cx="42%" cy="36%" r="72%">
      <stop offset="0" stop-color="#171510"/>
      <stop offset="1" stop-color="#080706"/>
    </radialGradient>
    <radialGradient id="node-emphasis" cx="40%" cy="32%" r="76%">
      <stop offset="0" stop-color="#211b11"/>
      <stop offset="0.58" stop-color="#100d09"/>
      <stop offset="1" stop-color="#070605"/>
    </radialGradient>
    <linearGradient id="gold-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d7650"/>
      <stop offset="0.48" stop-color="#fff0c8"/>
      <stop offset="1" stop-color="#d6b06a"/>
    </linearGradient>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" seed="17"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <style>
      .micro, .legend-label, .edge-label, .node-index, .node-detail, .footer-label {
        font-family: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
        letter-spacing: 0.14em;
      }
      .micro { font-size: 10px; fill: #d6b06a; }
      .headline { font-family: Newsreader, Georgia, serif; font-size: 43px; font-weight: 400; fill: #f2e5cf; letter-spacing: -0.025em; }
      .legend-label { font-size: 9px; fill: #a99b87; }
      .legend-strong { fill: #f2e5cf; }
      .edge-label { font-size: 9px; font-weight: 400; }
      .node-index { font-size: 8px; fill: #d6b06a; }
      .node-title { font-family: Newsreader, Georgia, serif; font-weight: 400; fill: #f2e5cf; letter-spacing: -0.025em; }
      .node-detail { font-size: 6.8px; fill: #a99b87; letter-spacing: 0.115em; }
      .footer-label { font-size: 8px; fill: #7f7465; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#background-glow)"/>
  <ellipse cx="1045" cy="430" rx="520" ry="370" fill="#d6b06a" opacity="0.025" filter="url(#soft-glow)"/>
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.035" style="mix-blend-mode:soft-light"/>

  <g aria-hidden="true">
    <path d="M 84 188 H 1516" stroke="#f2e5cf" stroke-opacity="0.12"/>
    <path d="M 84 898 H 1516" stroke="#f2e5cf" stroke-opacity="0.12"/>
    <path d="M 84 910 V 924 M 1516 910 V 924" stroke="#d6b06a" stroke-opacity="0.42"/>
  </g>

  <text x="84" y="70" class="micro">01 / A VISUAL GRAMMAR</text>
  <text x="84" y="137" class="headline">What can be stated is not yet what it means.</text>

  <g transform="translate(1125 68)">
    <circle cx="10" cy="10" r="9" fill="none" stroke="#f2e5cf" stroke-opacity="0.65"/>
    <circle cx="10" cy="1" r="2" fill="#d6b06a"/>
    <text x="33" y="8" class="legend-label legend-strong">NODE / PROPOSITION</text>
    <text x="33" y="23" class="legend-label">WHAT CAN BE STATED</text>
    <path d="M 235 10 H 283" stroke="#d6b06a" stroke-width="1.5"/>
    <text x="303" y="8" class="legend-label legend-strong">EDGE / RELATIONSHIP</text>
    <text x="303" y="23" class="legend-label">WHY IT MATTERS</text>
  </g>

  <g id="relationships">
    <g class="relationship">
      <path d="M 224 310 C 302 281 355 261 381 258" fill="none" stroke="#8d7650" stroke-width="1.35" stroke-linecap="round" opacity="0.72"/>
      <circle cx="224" cy="310" r="2.5" fill="#d6b06a" opacity="0.72"/>
      <g transform="translate(307 276) rotate(-10)">
        <rect x="-71" y="-14" width="142" height="28" rx="3" fill="#050505" stroke="#d6b06a" stroke-opacity="0.24"/>
        <text x="0" y="3.5" text-anchor="middle" class="edge-label" fill="#d6b06a">FEELS COLD TO</text>
      </g>
    </g>
    <g class="relationship">
      <path d="M 311 603 C 260 647 221 684 194 702" fill="none" stroke="#8d7650" stroke-width="1.35" stroke-linecap="round" opacity="0.72"/>
      <circle cx="311" cy="603" r="2.5" fill="#d6b06a" opacity="0.72"/>
      <g transform="translate(250 648) rotate(-31)">
        <rect x="-80" y="-14" width="160" height="28" rx="3" fill="#050505" stroke="#d6b06a" stroke-opacity="0.24"/>
        <text x="0" y="3.5" text-anchor="middle" class="edge-label" fill="#d6b06a">MATTERS BECAUSE</text>
      </g>
    </g>
    <g class="relationship">
      <path d="M 588 690 C 592 650 598 616 603 607" fill="none" stroke="#8d7650" stroke-width="1.35" stroke-linecap="round" opacity="0.72"/>
      <circle cx="588" cy="690" r="2.5" fill="#d6b06a" opacity="0.72"/>
      <g transform="translate(641 648) rotate(-84)">
        <rect x="-72.5" y="-14" width="145" height="28" rx="3" fill="#050505" stroke="#d6b06a" stroke-opacity="0.24"/>
        <text x="0" y="3.5" text-anchor="middle" class="edge-label" fill="#d6b06a">IS TRUSTED BY</text>
      </g>
    </g>
    <g class="relationship">
      <path d="M 879 430 C 888 507 904 568 916 588" fill="none" stroke="#8d7650" stroke-width="1.35" stroke-linecap="round" opacity="0.72"/>
      <circle cx="879" cy="430" r="2.5" fill="#d6b06a" opacity="0.72"/>
      <g transform="translate(938 514) rotate(79)">
        <rect x="-88" y="-14" width="176" height="28" rx="3" fill="#050505" stroke="#d6b06a" stroke-opacity="0.24"/>
        <text x="0" y="3.5" text-anchor="middle" class="edge-label" fill="#d6b06a">ASKS BEHAVIOR OF</text>
      </g>
    </g>
    <g class="relationship">
      <path d="M 967 305 C 1090 271 1241 282 1291 331" fill="none" stroke="url(#gold-line)" stroke-width="2.25" stroke-linecap="round" opacity="1"/>
      <circle cx="967" cy="305" r="2.5" fill="#d6b06a" opacity="1"/>
      <g transform="translate(1132 277) rotate(1)">
        <rect x="-85" y="-14" width="170" height="28" rx="3" fill="#050505" stroke="#d6b06a" stroke-opacity="0.24"/>
        <text x="0" y="3.5" text-anchor="middle" class="edge-label" fill="#fff5dc">INVITES GESTURE</text>
      </g>
    </g>
    <g class="relationship">
      <path d="M 1250 708 C 1306 646 1354 638 1390 667" fill="none" stroke="#8d7650" stroke-width="1.35" stroke-linecap="round" opacity="0.72"/>
      <circle cx="1250" cy="708" r="2.5" fill="#d6b06a" opacity="0.72"/>
      <g transform="translate(1325 644) rotate(-3)">
        <rect x="-91" y="-14" width="182" height="28" rx="3" fill="#050505" stroke="#d6b06a" stroke-opacity="0.24"/>
        <text x="0" y="3.5" text-anchor="middle" class="edge-label" fill="#d6b06a">SIGNALS STATUS TO</text>
      </g>
    </g>
  </g>
  <g id="propositions">
