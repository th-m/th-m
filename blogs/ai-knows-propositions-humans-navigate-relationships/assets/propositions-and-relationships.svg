      <circle cx="585" cy="785" r="96" fill="url(#node-neutral)" stroke="#f2e5cf" stroke-opacity="0.34" stroke-width="1.2"/>
      <circle cx="585" cy="690" r="3" fill="#d6b06a"/>
      <text x="585" y="714" text-anchor="middle" class="node-index">P.05</text>
      <text x="585" text-anchor="middle" class="node-title" font-size="21"><tspan x="585" y="777.445">CUSTOMER</tspan><tspan x="585" y="796.5550000000001">REQUEST</tspan></text>
      <text x="585" y="859" text-anchor="middle" class="node-detail">RECORDED STATEMENT</text>
    </g>
    <g class="proposition">
      <circle cx="610" cy="555" r="82" fill="none" stroke="#f2e5cf" stroke-opacity="0.07"/>
      <circle cx="610" cy="555" r="75" fill="url(#node-neutral)" stroke="#f2e5cf" stroke-opacity="0.34" stroke-width="1.2"/>
      <circle cx="610" cy="481" r="3" fill="#d6b06a"/>
      <text x="610" y="505" text-anchor="middle" class="node-index">P.06</text>
      <text x="610" text-anchor="middle" class="node-title" font-size="18"><tspan x="610" y="548.81">PRODUCT</tspan><tspan x="610" y="565.1899999999999">TEAM</tspan></text>
      <text x="610" y="608" text-anchor="middle" class="node-detail">DECISION MAKER</text>
    </g>
    <g class="proposition">
      <circle cx="868" cy="325" r="112" fill="none" stroke="#d6b06a" stroke-opacity="0.14"/>
      <circle cx="868" cy="325" r="105" fill="url(#node-emphasis)" stroke="#d6b06a" stroke-opacity="0.88" stroke-width="1.2"/>
      <circle cx="868" cy="221" r="3" fill="#d6b06a"/>
      <text x="868" y="245" text-anchor="middle" class="node-index">P.07</text>
      <text x="868" text-anchor="middle" class="node-title" font-size="21"><tspan x="868" y="317.445">TOUCH</tspan><tspan x="868" y="336.555">SCREEN</tspan></text>
      <text x="868" y="408" text-anchor="middle" class="node-detail">PRODUCT PROPERTY</text>
    </g>
    <g class="proposition">
      <circle cx="925" cy="665" r="86" fill="none" stroke="#f2e5cf" stroke-opacity="0.07"/>
      <circle cx="925" cy="665" r="79" fill="url(#node-neutral)" stroke="#f2e5cf" stroke-opacity="0.34" stroke-width="1.2"/>
      <circle cx="925" cy="587" r="3" fill="#d6b06a"/>
      <text x="925" y="611" text-anchor="middle" class="node-index">P.08</text>
      <text x="925" text-anchor="middle" class="node-title" font-size="18"><tspan x="925" y="658.81">NEW</tspan><tspan x="925" y="675.1899999999999">USER</tspan></text>
