      <circle cx="158" cy="323" r="74" fill="none" stroke="#f2e5cf" stroke-opacity="0.07"/>
      <circle cx="158" cy="323" r="67" fill="url(#node-neutral)" stroke="#f2e5cf" stroke-opacity="0.34" stroke-width="1.2"/>
      <circle cx="158" cy="257" r="3" fill="#d6b06a"/>
      <text x="158" y="281" text-anchor="middle" class="node-index">P.01</text>
      <text x="158" text-anchor="middle" class="node-title" font-size="27"><tspan x="158" y="325">68°F</tspan></text>
      <text x="158" y="368" text-anchor="middle" class="node-detail">RECORDED TEMPERATURE</text>
    </g>
    <g class="proposition">
      <circle cx="458" cy="260" r="84" fill="none" stroke="#f2e5cf" stroke-opacity="0.07"/>
      <circle cx="458" cy="260" r="77" fill="url(#node-neutral)" stroke="#f2e5cf" stroke-opacity="0.34" stroke-width="1.2"/>
      <circle cx="458" cy="184" r="3" fill="#d6b06a"/>
      <text x="458" y="208" text-anchor="middle" class="node-index">P.02</text>
      <text x="458" text-anchor="middle" class="node-title" font-size="18"><tspan x="458" y="253.81">PERSON</tspan><tspan x="458" y="270.19">AT WORK</tspan></text>
      <text x="458" y="315" text-anchor="middle" class="node-detail">OBSERVED SITUATION</text>
    </g>
