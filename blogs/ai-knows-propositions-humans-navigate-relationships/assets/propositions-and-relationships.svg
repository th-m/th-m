      <text x="1382" y="297" text-anchor="middle" class="node-index">P.10</text>
      <text x="1382" text-anchor="middle" class="node-title" font-size="21"><tspan x="1382" y="382.445">FELT</tspan><tspan x="1382" y="401.555">POSSIBILITY</tspan></text>
      <text x="1382" y="486" text-anchor="middle" class="node-detail">QUALITATIVE RESPONSE</text>
    </g>
    <g class="proposition">
      <circle cx="1435" cy="735" r="89" fill="none" stroke="#f2e5cf" stroke-opacity="0.07"/>
      <circle cx="1435" cy="735" r="82" fill="url(#node-neutral)" stroke="#f2e5cf" stroke-opacity="0.34" stroke-width="1.2"/>
      <circle cx="1435" cy="654" r="3" fill="#d6b06a"/>
      <text x="1435" y="678" text-anchor="middle" class="node-index">P.11</text>
      <text x="1435" text-anchor="middle" class="node-title" font-size="21"><tspan x="1435" y="727.445">BUYER</tspan><tspan x="1435" y="746.5550000000001">IDENTITY</tspan></text>
      <text x="1435" y="795" text-anchor="middle" class="node-detail">SOCIAL CONTEXT</text>
    </g>
  </g>

  <text x="84" y="946" class="footer-label">NODES ANSWER WHAT.</text>
  <text x="248" y="946" class="footer-label" fill="#d6b06a">EDGES ANSWER WHY.</text>
  <text x="1516" y="946" text-anchor="end" class="footer-label">ILLUSTRATIVE LANGUAGE · NOT A FORMAL DEFINITION OF GRAPH THEORY</text>
</svg>