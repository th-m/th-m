<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THOM Brand Snapshot Fixture</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #050505; color: #f2e5cf; }
      body { width: 900px; padding: 24px; font: 12px system-ui, sans-serif; }
      main { display: grid; grid-template-columns: repeat(2, 320px); gap: 32px; }
      figure { margin: 0; }
      figcaption { margin-bottom: 8px; color: #d6b06a; text-transform: uppercase; letter-spacing: .14em; }
      .current-frame { width: 320px; height: 240px; display: grid; place-items: center; overflow: hidden; background: #050505; }
      .current-frame img { width: 82%; height: 82%; object-fit: contain; }
      [data-glyph="m"] .current-frame img { height: auto; }
      .lockups { width: 672px; display: grid; gap: 24px; margin-top: 40px; }
      .lockup-frame { width: 672px; height: 220px; display: grid; place-items: center; overflow: hidden; background: #050505; }
      .lockup-frame img { width: 92%; height: 86%; object-fit: contain; }
      .compact-frame { height: 150px; }
      .compact-frame img { width: 70%; }
    </style>
  </head>
  <body>
    <main>
      <figure data-glyph="t"><figcaption>T / π</figcaption><div class="current-frame"><img src="/brand/glyph-t.svg" alt="Current THOM T glyph" /></div></figure>
      <figure data-glyph="h"><figcaption>H</figcaption><div class="current-frame"><img src="/brand/glyph-h.svg" alt="Current THOM H glyph" /></div></figure>
      <figure data-glyph="o"><figcaption>O</figcaption><div class="current-frame"><img src="/brand/glyph-o.svg" alt="Current THOM O glyph" /></div></figure>
      <figure data-glyph="m"><figcaption>M</figcaption><div class="current-frame"><img src="/brand/glyph-m.svg" alt="Current THOM M glyph" /></div></figure>
    </main>
    <section class="lockups" aria-label="THOM lockup snapshots">
      <figure data-lockup="master"><figcaption>Master display lockup</figcaption><div class="lockup-frame"><img src="/brand/thom-master.svg" alt="Current THOM master lockup" /></div></figure>
      <figure data-lockup="compact"><figcaption>Compact utility lockup</figcaption><div class="lockup-frame compact-frame"><img src="/brand/thom-compact.svg" alt="Current THOM compact lockup" /></div></figure>
    </section>
  </body>
</html>
